<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji2Smile</title><style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 18px;color:#202124}textarea{box-sizing:border-box;width:100%;min-height:130px;padding:14px;border:1px solid #ccd0d8;border-radius:9px;font:16px system-ui}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tools{display:flex;gap:10px;margin:12px 0}button,select,input{padding:9px;border:1px solid #ccd0d8;border-radius:7px;background:white}#exampleGrid{display:flex;flex-wrap:wrap;gap:6px;max-height:320px;overflow:auto;margin-top:12px}.example{font-size:20px;min-width:42px;cursor:pointer}#status{color:#666;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Emoji2Smile</h1><p>Convert emoji into text emoticons and kaomoji.</p><div class="tools"><label>Style <select id="styleSelect"><option value="western">Western</option><option value="kaomoji">Eastern (Kaomoji)</option></select></label><button id="clearButton">Clear</button><button id="sampleButton">Load example</button><button id="copyButton">Copy result</button></div><div class="grid"><section><h2>Input</h2><textarea id="input">Hello 😊! That was hilarious 😂. I love it ❤️</textarea></section><section><h2>Converted text</h2><textarea id="output" readonly></textarea><p id="status" aria-live="polite"></p></section></div><h2>Try an example</h2><input id="exampleSearch" type="search" placeholder="Search emoji or emoticon"><span id="exampleCount"></span><div id="exampleGrid"></div><script src="../src/index.js"></script><script src="app.js"></script></body></html>
